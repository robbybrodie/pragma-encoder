[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "pragma-encoder"
version = "0.1.0"
description = "Open-source implementation of the PRAGMA foundation model architecture"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}

[project.optional-dependencies]
# kfp is optional: pipeline components and pragma_pipeline.py import it
# conditionally (_KFP_AVAILABLE guard). Core training and the workbench API
# work without kfp installed.
workbench = ["kfp>=2"]

[tool.mypy]
strict = true
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = [
    # ML convention: uppercase matrix variables (X, X_train, X_test) are standard in numpy/sklearn
    "N806",
    # PyTorch convention: `import torch.nn.functional as F` is universal across the ecosystem
    "N812",
    # Deferred imports: optional dependencies (peft, kfp) are imported inside try/except or
    # inside methods to keep them optional. This is intentional throughout the codebase.
    "E402",
]
