[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "pragma-encoder"
version = "0.1.0"
description = "Open-source implementation of the PRAGMA foundation model architecture"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}

[project.optional-dependencies]
# kfp is optional: pipeline components and pragma_pipeline.py import it
# conditionally (_KFP_AVAILABLE guard). Core training and the workbench API
# work without kfp installed.
workbench = ["kfp>=2", "kfp-kubernetes>=1.2"]

[tool.mypy]
strict = true
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
# N806: X/X_scaled are standard ML variable names (scikit-learn convention).
# N812: import torch.nn as nn is established Python convention.
ignore = ["N806", "N812"]

[tool.ruff.lint.per-file-ignores]
# Test files use pytest.importorskip("torch") before src imports, which is the
# standard pattern for skipping entire modules when torch is unavailable.
# E402 (module-level import not at top) is intentional here.
"tests/test_*.py" = ["E402"]
# The IBM TabFormer smoke CSV header is a fixed-format string that cannot be wrapped.
"src/data/adapters/ibm_tabformer_smoke.py" = ["E501"]
