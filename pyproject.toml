[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pragma-encoder"
version = "0.1.0"
description = "Open-source implementation of the PRAGMA foundation model architecture"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["tests*"]

[project.optional-dependencies]
# kfp is optional: pipeline components and pragma_pipeline.py import it
# conditionally (_KFP_AVAILABLE guard). Core training and the workbench API
# work without kfp installed.
workbench = ["kfp>=2", "kfp-kubernetes>=1.2"]

[tool.mypy]
strict = true
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
# N806: X/X_scaled are standard ML variable names (scikit-learn convention).
# N812: import torch.nn as nn is established Python convention.
ignore = ["N806", "N812"]

[tool.ruff.lint.per-file-ignores]
# Test files use pytest.importorskip("torch") before src imports, which is the
# standard pattern for skipping entire modules when torch is unavailable.
# E402 (module-level import not at top) is intentional here.
"tests/test_*.py" = ["E402"]
# The IBM TabFormer smoke CSV header is a fixed-format string that cannot be wrapped.
"src/pragma_encoder/data/adapters/ibm_tabformer_smoke.py" = ["E501"]
# The Level 3b smoke test embeds a TabFormer CSV header and assertion messages that
# cannot be wrapped without altering the fixed IBM format or test clarity.
"tests/openshift/test_03b_training_job_smoke.py" = ["E501"]
# The Level 3 smoke pipeline embeds the same fixed-format TabFormer CSV header.
"pipeline/pragma_smoke_pipeline.py" = ["E501"]
# The Level 3 pipeline smoke test has print statements with KFP run IDs and log
# markers that cannot be wrapped without losing diagnostic clarity.
"tests/openshift/test_03_pipeline_smoke_run.py" = ["E501"]
# The Level 4 PyTorchJob smoke test embeds the TabFormer CSV header, shell script
# lines with long path arguments, and diagnostic assertion messages.
"tests/openshift/test_04_pytorchjob_smoke.py" = ["E501"]
# The Level 5 S3 checkpoint/resume smoke embeds a TabFormer CSV header and has
# long assertion messages that cannot be wrapped without losing diagnostic clarity.
"tests/openshift/test_05_s3_checkpoint_resume.py" = ["E501"]
# The Level 6 GPU smoke test has long shell script lines and assertion messages.
"tests/openshift/test_06_gpu_training_smoke.py" = ["E501"]
# The image contract runtime test has assertion messages that include long
# pragma_encoder module paths — these cannot be shortened without losing clarity.
"tests/openshift/test_02b_image_contract_runtime.py" = ["E501"]
# The checkpoint resume tests have mock.patch strings and assertion messages
# that include full pragma_encoder.training.checkpoints module paths.
"tests/test_checkpoint_resume.py" = ["E501"]
# The workbench API test has a with-statement that exceeds 100 chars after the
# pragma_encoder namespace rename; the mock.patch path cannot be shortened.
"tests/test_workbench_api.py" = ["E501"]
# The workbench submit test has an error message with the full module path.
"tests/test_workbench_submit.py" = ["E501"]
