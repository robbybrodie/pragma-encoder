# PRAGMA-M Configuration — ~100M parameters (aspirational)
# Large-scale training variant. Requires significant GPU resources.
#
# Reference: Ostroukhov et al. (2026), Section 2.3.1
# Usage: python scripts/train_pragma.py --config configs/pragma_m.yaml

model_name: pragma-m
description: "PRAGMA Medium — ~100M parameters, aspirational open implementation"

# Vocabulary
vocab_size: 50000
profile_vocab_size: 10000

# Shared hidden dimension
d_model: 768

# Profile State Encoder (Section 2.3.2)
profile_encoder:
  n_heads: 12
  n_layers: 6
  d_ff: 3072
  max_seq_len: 512
  dropout: 0.1

# Event Encoder (Section 2.3.3)
event_encoder:
  n_heads: 12
  n_layers: 6
  d_ff: 3072
  max_seq_len: 128
  dropout: 0.1

# History Encoder (Section 2.3.4)
history_encoder:
  n_heads: 12
  n_layers: 12
  d_ff: 3072
  max_seq_len: 512
  dropout: 0.1

# Training objective (Section 2.3.5)
training:
  mask_prob: 0.15
  label_smoothing: 0.1
  optimizer: adamw
  learning_rate: 3.0e-5
  weight_decay: 0.01
  warmup_steps: 5000
  max_steps: 500000
  batch_size: 128
  gradient_clip: 1.0
  gradient_accumulation_steps: 4

# Tokenisation (Section 2.2)
tokenizer:
  n_amount_buckets: 100
  bpe_vocab_size: 8000
  bpe_max_length: 16
  n_log_buckets: 128
