# Container Registry Credentials Template
# Copy to: openshift/secrets/registry-credentials.yaml (gitignored)
# Populate and create as a Kubernetes Secret, or use Sealed Secrets.
#
# DO NOT commit the populated file. Only this template is committed.
#
# Usage:
#   oc create secret docker-registry pragma-registry \
#     --docker-server=registry.example.com \
#     --docker-username=YOUR_USERNAME \
#     --docker-password=YOUR_PASSWORD \
#     -n pragma-encoder

apiVersion: v1
kind: Secret
metadata:
  name: pragma-registry
  namespace: pragma-encoder
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: REPLACE_WITH_BASE64_ENCODED_DOCKER_CONFIG
