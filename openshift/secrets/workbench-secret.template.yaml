# Workbench Environment Secret Template
# Copy to: openshift/secrets/workbench-secret.yaml (gitignored)
# Populate with real credentials, then seal with kubeseal.
#
# DO NOT commit the populated file. Only this template is committed.
#
# Production pattern: Use Sealed Secrets or External Secrets Operator.
#
# Seal with kubeseal:
#   kubeseal --format yaml < workbench-secret.yaml > sealed-workbench-secret.yaml
# Then commit the sealed version to openshift/gitops/secrets/

apiVersion: v1
kind: Secret
metadata:
  name: pragma-workbench-env
  namespace: pragma-encoder
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: REPLACE_ME
  AWS_SECRET_ACCESS_KEY: REPLACE_ME
  NGC_API_KEY: REPLACE_ME
  HF_TOKEN: REPLACE_ME
