# Workbench Environment Secret Template — S3 Connection
#
# Schema source of truth: redhat-ods-applications/s3 ConfigMap, RHOAI 2.25.6
# Native S3 Connection env var names match what the RHOAI dashboard injects.
#
# Usage:
#   1. Copy to: openshift/secrets/workbench-secret.yaml  (gitignored)
#   2. Fill in real values (never commit populated version)
#   3. Seal with kubeseal:
#        kubeseal --scope namespace-wide \
#          --namespace pragma-encoder \
#          --format yaml \
#          < openshift/secrets/workbench-secret.yaml \
#          > openshift/gitops/secrets/workbench-runtime-secret.sealed.yaml
#   4. Commit the sealed version.
#
# DO NOT commit the populated file. Only this template is committed.
# Production pattern: Sealed Secrets managed by ArgoCD.
#
# Non-S3 credentials (NGC_API_KEY, HF_TOKEN) are NOT part of the S3 Connection.
# They belong in a separate registry-credentials Secret:
#   openshift/secrets/registry-credentials.template.yaml  (not yet created)
#
# Reference: docs/openshift-storage-pattern.md §Credentials
# Reference: docs/openshift-ai-3.3-alignment.md §Connection / Data Connection
# TD-010 resolved 2026-05-22: SealedSecret re-sealed with native AWS_* keys.

apiVersion: v1
kind: Secret
metadata:
  name: pragma-workbench-env
  namespace: pragma-encoder
  annotations:
    # OpenShift AI Connection metadata — required for dashboard visibility.
    # Without these annotations the Secret is not shown as a Data Connection
    # in the RHOAI project view even though the data is present and usable.
    opendatahub.io/managed: "true"
    opendatahub.io/connection-type: s3
    opendatahub.io/display-name: "PRAGMA Object Storage"
  labels:
    opendatahub.io/dashboard: "true"
type: Opaque
stringData:

  # -----------------------------------------------------------------------
  # Native OpenShift AI S3 Connection fields
  # Source of truth: oc get cm s3 -n redhat-ods-applications -o yaml
  # -----------------------------------------------------------------------
  AWS_ACCESS_KEY_ID: REPLACE_ME       # S3 access key ID (required)
  AWS_SECRET_ACCESS_KEY: REPLACE_ME   # S3 secret access key (required)
  AWS_S3_ENDPOINT: REPLACE_ME         # S3 endpoint URL, e.g. https://s3.us-west-2.amazonaws.com (required)
  AWS_DEFAULT_REGION: REPLACE_ME      # S3 region, e.g. us-west-2 (optional)
  AWS_S3_BUCKET: REPLACE_ME           # S3 bucket name (optional — can also be passed per-job)
