# Workbench Environment Secret Template
#
# RHOAI 3.3 alignment: this Secret is a test fixture/default representing
# what an RHOAI object-storage Connection would inject into workbench and
# training pods. See: docs/openshift-ai-3.3-alignment.md §Connection
# and: tests/openshift/fixtures/object-storage-connection.yaml.template
#
# Usage:
#   1. Copy to: openshift/secrets/workbench-secret.yaml  (gitignored)
#   2. Fill in real values (never commit populated version)
#   3. Seal with kubeseal:
#        kubeseal --format yaml < workbench-secret.yaml \
#          > openshift/gitops/secrets/workbench-runtime-secret.sealed.yaml
#   4. Commit the sealed version.
#
# DO NOT commit the populated file. Only this template is committed.
# Production pattern: Sealed Secrets managed by ArgoCD.

apiVersion: v1
kind: Secret
metadata:
  name: pragma-workbench-env
  namespace: pragma-encoder
type: Opaque
stringData:

  # -----------------------------------------------------------------------
  # S3 / Object Storage — used by pragma_encoder.training.checkpoints
  # -----------------------------------------------------------------------
  # These variable names (MODEL_REGISTRY_*) are specific to this repo.
  # Standard RHOAI Connections inject AWS_* env vars instead. When migrating
  # to a formal RHOAI Connection, align variable names with RHOAI defaults
  # or create the Connection with these custom key names.
  # See: docs/openshift-ai-3.3-alignment.md §Alignment gap
  MODEL_REGISTRY_BUCKET: REPLACE_ME        # S3 bucket name
  MODEL_REGISTRY_ENDPOINT: REPLACE_ME      # S3 endpoint URL, e.g. https://s3.example.com
  MODEL_REGISTRY_ACCESS_KEY: REPLACE_ME    # S3 access key ID
  MODEL_REGISTRY_SECRET_KEY: REPLACE_ME    # S3 secret access key

  # -----------------------------------------------------------------------
  # Workbench / notebook dependencies (not used by training code directly)
  # -----------------------------------------------------------------------
  NGC_API_KEY: REPLACE_ME                  # NVIDIA NGC API key (optional)
  HF_TOKEN: REPLACE_ME                     # Hugging Face token (optional)
