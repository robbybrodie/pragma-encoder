# PRAGMA-S single-node PyTorchJob
# Wave 0 (manual trigger): the job is NOT auto-triggered by ArgoCD — apply manually:
#   oc apply -f openshift/training/pytorchjob-pragma-s.yaml -n pragma-encoder
#
# RHOAI 3.3 supports PyTorchJob (kubeflow.org/v1) only.
# The KFTO v2 TrainJob (trainer.kubeflow.org/v1alpha1) is NOT supported in RHOAI 3.3.
#
# Prerequisites:
#   oc get crd pytorchjobs.kubeflow.org    # verify KFTO is installed
#   # CSV and vocab.pkl must exist on the workbench PVC before launching:
#   #   /opt/app-root/src/pragma-encoder/data/tabformer/card_transaction.v1.csv
#   #   /opt/app-root/src/pragma-encoder/data/tabformer/vocab.pkl
#   # Run fit_tokenizer.py in the workbench to produce vocab.pkl before launching.
#
# Monitor:
#   oc get pytorchjob pragma-s-pretrain -n pragma-encoder
#   oc logs -f -l job-name=pragma-s-pretrain,replica-type=master -n pragma-encoder
#
# Reference: Ostroukhov et al. (2026), PRAGMA-S (~10M parameter) configuration
---
apiVersion: kubeflow.org/v1
kind: PyTorchJob
metadata:
  name: pragma-s-pretrain
  namespace: pragma-encoder
  labels:
    app: pragma-encoder
    variant: pragma-s
spec:
  pytorchReplicaSpecs:

    # Master: rank-0 process — always exactly 1 replica
    Master:
      replicas: 1
      restartPolicy: OnFailure
      template:
        metadata:
          labels:
            app: pragma-s-pretrain
        spec:
          # ServiceAccount with anyuid SCC grant — required because the training
          # container may run as root (uid 0), which OpenShift's default
          # restricted-v2 SCC does not permit.
          # Created by openshift/gitops/rbac/service-accounts.yaml.
          serviceAccountName: pragma-encoder-training
          # Pin to GPU node — workbench PVC is ReadWriteOnce and already bound
          # to this node. Without this selector the job may land on a different
          # GPU node and fail to mount the PVC. Matches the workbench nodeSelector.
          nodeSelector:
            nvidia.com/gpu.present: "true"
          containers:
            - name: pytorch
              # Use the same workbench image (has PRAGMA Python dependencies installed)
              image: image-registry.openshift-image-registry.svc:5000/pragma-encoder/pragma-encoder-workbench:latest
              imagePullPolicy: IfNotPresent
              command:
                - python
                - /opt/app-root/src/pragma-encoder/scripts/train_pragma.py
                - --csv-path
                - /opt/app-root/src/pragma-encoder/data/tabformer/card_transaction.v1.csv
                - --vocab-path
                - /opt/app-root/src/pragma-encoder/data/tabformer/vocab.pkl
                - --output-dir
                - /outputs/pragma-s
                - --epochs
                - "1"
                - --batch-size
                - "16"
                - --log-every
                - "10"
                - --max-steps
                - "20"
              envFrom:
                - secretRef:
                    name: pragma-workbench-env
              resources:
                requests:
                  cpu: "8"
                  memory: 64Gi
                  nvidia.com/gpu: "1"
                limits:
                  cpu: "8"
                  memory: 64Gi
                  nvidia.com/gpu: "1"
              volumeMounts:
                - name: workbench-data
                  mountPath: /opt/app-root/src
                - name: model-output
                  mountPath: /outputs
                - name: dshm
                  mountPath: /dev/shm
          volumes:
            - name: workbench-data
              persistentVolumeClaim:
                claimName: pragma-encoder-workbench-data
            - name: model-output
              persistentVolumeClaim:
                claimName: pragma-encoder-model-output
            - name: dshm
              emptyDir:
                medium: Memory
                sizeLimit: 8Gi
          imagePullSecrets:
            - name: pragma-registry
    # Single-node job — no Worker spec.
    # KFTO webhook rejects Worker.replicas=0; omit Worker for Master-only jobs.
---
# PVC for model checkpoints and training outputs
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pragma-encoder-model-output
  namespace: pragma-encoder
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
