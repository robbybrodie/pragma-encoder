# PRAGMA-M multi-node PyTorchJob (production / aspirational)
# Trains the PRAGMA-M (~100M parameter) model across multiple GPU nodes.
# Requires a cluster with sufficient GPU capacity (4 nodes × 4 GPUs).
#
# Apply manually (not auto-triggered by ArgoCD):
#   oc apply -f openshift/gitops/training/pytorchjob-pragma-m.yaml -n pragma-encoder
#
# RHOAI 3.3 supports PyTorchJob (kubeflow.org/v1) only.
#
# Prerequisites:
#   oc get crd pytorchjobs.kubeflow.org
#   oc get pvc pragma-encoder-training-data -n pragma-encoder  # data PVC must exist
#
# Reference: Ostroukhov et al. (2026), PRAGMA-M (~100M parameter) configuration
apiVersion: kubeflow.org/v1
kind: PyTorchJob
metadata:
  name: pragma-m-pretrain
  namespace: pragma-encoder
  labels:
    app: pragma-encoder
    variant: pragma-m
spec:
  pytorchReplicaSpecs:
    Master:
      replicas: 1
      restartPolicy: OnFailure
      template:
        metadata:
          labels:
            app: pragma-m-pretrain
        spec:
          serviceAccountName: pragma-encoder-training
          containers:
            - name: pytorch
              image: image-registry.openshift-image-registry.svc:5000/pragma-encoder/pragma-encoder-workbench:latest
              imagePullPolicy: IfNotPresent
              command:
                - torchrun
                - --nproc_per_node=4
                - /opt/app-root/src/pragma-encoder/scripts/train_pragma.py
                - --config
                - /opt/app-root/src/pragma-encoder/configs/pragma_m.yaml
                - --data-dir
                - /data/transactions
                - --output-dir
                - /outputs/pragma-m
              envFrom:
                - secretRef:
                    name: pragma-workbench-env
              resources:
                requests:
                  cpu: "16"
                  memory: 128Gi
                  nvidia.com/gpu: "4"
                limits:
                  cpu: "16"
                  memory: 128Gi
                  nvidia.com/gpu: "4"
              volumeMounts:
                - name: workbench-data
                  mountPath: /opt/app-root/src
                - name: training-data
                  mountPath: /data
                - name: model-output
                  mountPath: /outputs
          volumes:
            - name: workbench-data
              persistentVolumeClaim:
                claimName: pragma-encoder-workbench-data
            - name: training-data
              persistentVolumeClaim:
                claimName: pragma-encoder-training-data
            - name: model-output
              persistentVolumeClaim:
                claimName: pragma-encoder-model-output
          imagePullSecrets:
            - name: pragma-registry
    Worker:
      replicas: 3
      restartPolicy: OnFailure
      template:
        metadata:
          labels:
            app: pragma-m-pretrain
        spec:
          serviceAccountName: pragma-encoder-training
          containers:
            - name: pytorch
              image: image-registry.openshift-image-registry.svc:5000/pragma-encoder/pragma-encoder-workbench:latest
              imagePullPolicy: IfNotPresent
              command:
                - torchrun
                - --nproc_per_node=4
                - /opt/app-root/src/pragma-encoder/scripts/train_pragma.py
                - --config
                - /opt/app-root/src/pragma-encoder/configs/pragma_m.yaml
                - --data-dir
                - /data/transactions
                - --output-dir
                - /outputs/pragma-m
              envFrom:
                - secretRef:
                    name: pragma-workbench-env
              resources:
                requests:
                  cpu: "16"
                  memory: 128Gi
                  nvidia.com/gpu: "4"
                limits:
                  cpu: "16"
                  memory: 128Gi
                  nvidia.com/gpu: "4"
              volumeMounts:
                - name: workbench-data
                  mountPath: /opt/app-root/src
                - name: training-data
                  mountPath: /data
                - name: model-output
                  mountPath: /outputs
          volumes:
            - name: workbench-data
              persistentVolumeClaim:
                claimName: pragma-encoder-workbench-data
            - name: training-data
              persistentVolumeClaim:
                claimName: pragma-encoder-training-data
            - name: model-output
              persistentVolumeClaim:
                claimName: pragma-encoder-model-output
          imagePullSecrets:
            - name: pragma-registry
