# RBAC — ServiceAccount for training pods + anyuid SCC grant
# Wave 0: applied immediately after the namespace so the SA exists before any pod launches.
#
# The PRAGMA training container runs as root (uid 0). OpenShift's default
# restricted-v2 SCC blocks this. The ClusterRole + RoleBinding below grant
# the anyuid SCC to pragma-encoder-training within the pragma-encoder namespace only.
# The workbench pod uses the platform-injected SA (do NOT set serviceAccountName
# on the Notebook CR — the Kubeflow Notebook Controller handles that).
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pragma-encoder-training
  namespace: pragma-encoder
  labels:
    app: pragma-encoder
  annotations:
    argocd.argoproj.io/sync-wave: "0"

---
# ClusterRole is cluster-scoped; ArgoCD's SA in openshift-gitops has cluster-admin
# and will create this successfully. Scoped by resourceNames to anyuid only.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pragma-encoder-anyuid-scc
  labels:
    app: pragma-encoder
  annotations:
    argocd.argoproj.io/sync-wave: "0"
rules:
  - apiGroups:
      - security.openshift.io
    resources:
      - securitycontextconstraints
    resourceNames:
      - anyuid
    verbs:
      - use

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pragma-encoder-training-anyuid
  namespace: pragma-encoder
  labels:
    app: pragma-encoder
  annotations:
    argocd.argoproj.io/sync-wave: "0"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pragma-encoder-anyuid-scc
subjects:
  - kind: ServiceAccount
    name: pragma-encoder-training
    namespace: pragma-encoder
