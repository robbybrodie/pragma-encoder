apiVersion: v1
kind: ServiceAccount
metadata:
  name: pragma-pipeline-runner
  namespace: pragma-encoder
  labels:
    app: pragma-encoder
    app.kubernetes.io/managed-by: argocd
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pragma-pipeline-role
  namespace: pragma-encoder
rules:
  - apiGroups: ["kubeflow.org"]
    resources: ["pytorchjobs"]
    verbs: ["get", "list", "create", "delete", "patch", "watch"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pragma-pipeline-rolebinding
  namespace: pragma-encoder
subjects:
  - kind: ServiceAccount
    name: pragma-pipeline-runner
    namespace: pragma-encoder
roleRef:
  kind: Role
  name: pragma-pipeline-role
  apiGroup: rbac.authorization.k8s.io
