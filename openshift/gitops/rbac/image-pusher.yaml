# Grant pragma-encoder/builder SA push rights to redhat-ods-applications ImageStream.
# Wave 0: must exist before the BuildConfig (wave 2) triggers the first build.
#
# The BuildConfig outputs to redhat-ods-applications/pragma-encoder-workbench:latest
# so the RHOAI dashboard discovers the image. Without this RoleBinding the build
# fails with "unauthorized: authentication required" when pushing to the target IS.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pragma-encoder-builder-image-pusher
  namespace: redhat-ods-applications
  labels:
    app: pragma-encoder
  annotations:
    argocd.argoproj.io/sync-wave: "0"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:image-pusher
subjects:
  - kind: ServiceAccount
    name: builder
    namespace: pragma-encoder
