# ==============================================================================
# Sealed Workbench Environment Secret — pragma-encoder
# ==============================================================================
# Safe to commit: values are asymmetrically encrypted by the cluster's
# Sealed Secrets controller (kube-system/sealed-secrets-controller).
# Decryption requires the controller's private key, which never leaves the cluster.
#
# Scope:    namespace-wide (pragma-encoder namespace only)
# Decrypts: Secret pragma-workbench-env (OpenShift AI S3 Connection)
# Keys:     AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_S3_ENDPOINT,
#           AWS_DEFAULT_REGION, AWS_S3_BUCKET
# Sealed:   2026-05-22 with kubeseal v0.36.6 (native AWS_* schema, TD-010 resolved)
#
# Connection ownership:
#   This SealedSecret is the authoritative source of the RHOAI S3 Connection.
#   ArgoCD syncs it in wave 0. The Sealed Secrets controller decrypts it into
#   Secret pragma-workbench-env. The RHOAI dashboard presents it as a
#   Data Connection because spec.template.metadata carries the required
#   opendatahub.io annotations (plain YAML — no credential data).
#
#   No plaintext credentials are committed. The template for local sealing is:
#     openshift/secrets/workbench-secret.template.yaml
#
# To re-seal after credential rotation:
#   1. Copy workbench-secret.template.yaml -> workbench-secret.yaml (gitignored)
#   2. Fill in real AWS_* values
#   3. kubeseal --scope namespace-wide \
#        --namespace pragma-encoder \
#        --format yaml \
#        < openshift/secrets/workbench-secret.yaml \
#        > openshift/gitops/secrets/workbench-runtime-secret.sealed.yaml
#   4. Commit the sealed file; delete workbench-secret.yaml locally
# ==============================================================================
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  annotations:
    sealedsecrets.bitnami.com/namespace-wide: "true"
  name: pragma-workbench-env
  namespace: pragma-encoder
spec:
  encryptedData:
    AWS_ACCESS_KEY_ID: 
    AWS_DEFAULT_REGION: 
    AWS_S3_BUCKET: 
    AWS_S3_ENDPOINT: 
    AWS_SECRET_ACCESS_KEY: 
  template:
    metadata:
      annotations:
        opendatahub.io/connection-type: s3
        opendatahub.io/display-name: PRAGMA Object Storage
        opendatahub.io/managed: "true"
        sealedsecrets.bitnami.com/namespace-wide: "true"
      labels:
        opendatahub.io/dashboard: "true"
      name: pragma-workbench-env
      namespace: pragma-encoder
    type: Opaque
