# ==============================================================================
# Sealed Workbench Environment Secret — pragma-encoder
# ==============================================================================
# Safe to commit: values are asymmetrically encrypted by the cluster's
# Sealed Secrets controller (kube-system/sealed-secrets-controller).
# Decryption requires the controller's private key, which never leaves the cluster.
#
# Scope: namespace-wide (pragma-encoder namespace only)
# Sealed: 2026-05-17 with kubeseal v0.36.6
#
# IMPORTANT — SCHEMA MISMATCH (TD-010):
#   The encrypted keys in this file use legacy MODEL_REGISTRY_* naming:
#     MODEL_REGISTRY_ACCESS_KEY, MODEL_REGISTRY_BUCKET,
#     MODEL_REGISTRY_ENDPOINT, MODEL_REGISTRY_SECRET_KEY
#
#   The native OpenShift AI S3 Connection schema uses:
#     AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_S3_ENDPOINT, AWS_S3_BUCKET
#
#   The training code accepts both (with DeprecationWarning for MODEL_REGISTRY_*).
#   This SealedSecret must be re-sealed with native AWS_* key names to remove the warning.
#   See: TD-010 in docs/tech-debt.md
#   Template: openshift/secrets/workbench-secret.template.yaml
#
# TECH DEBT:
#   TD-001 — S3 bucket shared with nemo-tfm (nemo-tfm-pipelines-e17c4943)
#             Resolve: create dedicated pragma-encoder-pipelines-<suffix> bucket,
#             re-seal with new bucket values before production.
#   TD-002 — NGC API key shared with nemo-tfm deployment.
#             Resolve: generate dedicated NGC key, re-seal before production.
#   TD-010 — SealedSecret carries legacy MODEL_REGISTRY_* key names.
#             Resolve: re-seal with native AWS_* key names (see above).
#   See: docs/tech-debt.md
#
# To re-seal after credential rotation:
#   kubeseal --scope namespace-wide \
#     --namespace pragma-encoder \
#     --format yaml \
#     < openshift/secrets/workbench-secret.yaml \
#     > openshift/gitops/secrets/workbench-runtime-secret.sealed.yaml
# ==============================================================================
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  annotations:
    sealedsecrets.bitnami.com/namespace-wide: "true"
  name: pragma-workbench-env
  namespace: pragma-encoder
spec:
  encryptedData:
    AI_PLATFORM_API_URL: 
    MODEL_REGISTRY_ACCESS_KEY: 
    MODEL_REGISTRY_BUCKET: 
    MODEL_REGISTRY_ENDPOINT: 
    MODEL_REGISTRY_SECRET_KEY: 
    NGC_API_KEY: 
  template:
    metadata:
      annotations:
        sealedsecrets.bitnami.com/namespace-wide: "true"
        # OpenShift AI Connection metadata — required for dashboard visibility.
        # These annotations make the Secret appear as a Data Connection in the
        # RHOAI project view. The Sealed Secrets controller copies this metadata
        # verbatim to the resulting Secret; no re-sealing of data is needed.
        opendatahub.io/managed: "true"
        opendatahub.io/connection-type: s3
        opendatahub.io/display-name: "PRAGMA Object Storage"
      labels:
        opendatahub.io/dashboard: "true"
      name: pragma-workbench-env
      namespace: pragma-encoder
    type: Opaque
