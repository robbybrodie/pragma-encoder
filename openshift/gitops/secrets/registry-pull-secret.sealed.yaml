# ==============================================================================
# Sealed Registry Pull Secret — pragma-encoder
# ==============================================================================
# Safe to commit: values are asymmetrically encrypted by the cluster's
# Sealed Secrets controller (kube-system/sealed-secrets-controller).
# Decryption requires the controller's private key, which never leaves the cluster.
#
# Scope: namespace-wide (pragma-encoder namespace only)
# Registry: nvcr.io (NVIDIA NGC — pulls nvcr.io/nvidia/nemo:25.09.01)
# Sealed: 2026-05-17 with kubeseal v0.36.6
#
# TECH DEBT:
#   TD-002 — NGC API key shared with nemo-tfm deployment.
#             Resolve: generate dedicated NGC key, re-seal before production.
#   See: docs/tech-debt.md
#
# To re-seal after credential rotation:
#   kubeseal --scope namespace-wide \
#     --namespace pragma-encoder \
#     --format yaml \
#     < openshift/secrets/registry-credentials.yaml \
#     > openshift/gitops/secrets/registry-pull-secret.sealed.yaml
# ==============================================================================
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  annotations:
    sealedsecrets.bitnami.com/namespace-wide: "true"
  name: pragma-registry
  namespace: pragma-encoder
spec:
  encryptedData:
    .dockerconfigjson: 
  template:
    metadata:
      annotations:
        sealedsecrets.bitnami.com/namespace-wide: "true"
      name: pragma-registry
      namespace: pragma-encoder
    type: kubernetes.io/dockerconfigjson
