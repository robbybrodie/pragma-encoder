# ImageStream — registers the custom PRAGMA workbench image with the RHOAI dashboard.
# Wave 1: created before the BuildConfig so the output tag exists when the build fires.
#
# MUST be in redhat-ods-applications namespace — the RHOAI dashboard only discovers
# notebook images from ImageStreams in that namespace (label: opendatahub.io/notebook-image=true).
# An ImageStream in pragma-encoder with the same label is invisible to the dashboard.
#
# The BuildConfig in pragma-encoder outputs to this ImageStream via the fully-qualified
# ImageStreamTag reference: redhat-ods-applications/pragma-encoder-workbench:latest.
# The pragma-encoder/builder SA is granted image-pusher role in redhat-ods-applications
# (see rbac/image-pusher.yaml).
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: pragma-encoder-workbench
  namespace: redhat-ods-applications
  labels:
    opendatahub.io/notebook-image: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    opendatahub.io/notebook-image-name: "PRAGMA Encoder"
    opendatahub.io/notebook-image-desc: "RHOAI S2I base with PRAGMA transaction encoder dependencies"
    opendatahub.io/notebook-image-url: "https://github.com/robbybrodie/pragma-encoder"
    opendatahub.io/notebook-image-order: "1"
    opendatahub.io/recommended-accelerators: '["nvidia.com/gpu"]'
spec:
  lookupPolicy:
    local: true
  tags:
    - name: latest
      annotations:
        opendatahub.io/notebook-software: |
          [{"name":"Python","version":"v3.11"},{"name":"PyTorch","version":"2.x"},{"name":"JupyterLab","version":"4.x"}]
        opendatahub.io/notebook-python-dependencies: |
          [{"name":"pragma-encoder","version":"0.1.0"},{"name":"kfp","version":"2.x"},{"name":"torch","version":"2.x"}]
        opendatahub.io/workbench-image-recommended: "true"
      from:
        kind: DockerImage
        name: image-registry.openshift-image-registry.svc:5000/redhat-ods-applications/pragma-encoder-workbench:latest
      referencePolicy:
        type: Local
