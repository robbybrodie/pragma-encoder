# GPU HardwareProfile for PRAGMA Encoder workbench.
# Must be in redhat-ods-applications — the RHOAI dashboard only discovers
# HardwareProfile resources from that namespace.
#
# This profile matches the Notebook CR's resource requests/limits:
#   cpu: 4-8, memory: 32-64Gi, nvidia.com/gpu: 1
#
# The dashboard will show this profile in the workbench hardware selector
# and the Notebook CR references it via:
#   opendatahub.io/hardware-profile-name: pragma-encoder-gpu
#   opendatahub.io/hardware-profile-namespace: redhat-ods-applications
#
# spec.scheduling.type=Node pins workloads to GPU nodes via nodeSelector.
# spec.nodeSelector is NOT a valid field — nodeSelector lives under
# spec.scheduling.node.nodeSelector (infrastructure.opendatahub.io/v1 schema).
apiVersion: infrastructure.opendatahub.io/v1
kind: HardwareProfile
metadata:
  name: pragma-encoder-gpu
  namespace: redhat-ods-applications
  labels:
    app.kubernetes.io/part-of: hardwareprofile
    app.opendatahub.io/hardwareprofile: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    opendatahub.io/display-name: "PRAGMA Encoder GPU"
    opendatahub.io/description: "4-8 CPUs, 32-64 GiB memory, 1 NVIDIA GPU — for PRAGMA encoder training and evaluation"
    opendatahub.io/disabled: "false"
    opendatahub.io/managed: "false"
spec:
  identifiers:
    - displayName: CPU
      identifier: cpu
      resourceType: CPU
      defaultCount: 4
      minCount: 1
      maxCount: 8
    - displayName: Memory
      identifier: memory
      resourceType: Memory
      defaultCount: 32Gi
      minCount: 8Gi
      maxCount: 64Gi
    - displayName: NVIDIA GPU
      identifier: nvidia.com/gpu
      resourceType: Accelerator
      defaultCount: 1
      minCount: 1
      maxCount: 1
  scheduling:
    type: Node
    node:
      nodeSelector:
        nvidia.com/gpu.present: "true"
