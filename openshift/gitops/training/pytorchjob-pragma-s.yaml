# PRAGMA-S single-node PyTorchJob
# Trains the PRAGMA-S (~10M parameter) model on a single GPU node.
# For development and proof-of-concept pretraining.
#
# Deployed via: oc apply -f openshift/gitops/training/pytorchjob-pragma-s.yaml
# Follows the kubeflow.org/v1 PyTorchJob API (GA, not Tech Preview).
#
# Reference: Ostroukhov et al. (2026) — training configuration

apiVersion: kubeflow.org/v1
kind: PyTorchJob
metadata:
  name: pragma-s-pretrain
  namespace: pragma-encoder
  labels:
    app: pragma-encoder
    variant: pragma-s
spec:
  pytorchReplicaSpecs:
    Master:
      replicas: 1
      restartPolicy: OnFailure
      template:
        spec:
          containers:
            - name: pytorch
              image: pragma-encoder:latest   # Build via openshift/notebook-image/
              command:
                - python
                - scripts/train_pragma.py
                - --config
                - configs/pragma_s.yaml
                - --data-dir
                - /data/transactions
                - --output-dir
                - /outputs/pragma-s
                - --epochs
                - "10"
              resources:
                limits:
                  nvidia.com/gpu: "1"
                  memory: "32Gi"
                requests:
                  memory: "16Gi"
              volumeMounts:
                - name: data
                  mountPath: /data
                - name: outputs
                  mountPath: /outputs
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: pragma-data-pvc
            - name: outputs
              persistentVolumeClaim:
                claimName: pragma-outputs-pvc
