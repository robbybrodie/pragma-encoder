# PRAGMA-M multi-node PyTorchJob (production / aspirational)
# Trains the PRAGMA-M (~100M parameter) model across multiple GPU nodes.
# Requires a cluster with sufficient GPU capacity.
#
# Deployed via: oc apply -f openshift/gitops/training/pytorchjob-pragma-m.yaml
# Follows the kubeflow.org/v1 PyTorchJob API (GA, not Tech Preview).
#
# Reference: Ostroukhov et al. (2026) — training at scale

apiVersion: kubeflow.org/v1
kind: PyTorchJob
metadata:
  name: pragma-m-pretrain
  namespace: pragma-encoder
  labels:
    app: pragma-encoder
    variant: pragma-m
spec:
  pytorchReplicaSpecs:
    Master:
      replicas: 1
      restartPolicy: OnFailure
      template:
        spec:
          containers:
            - name: pytorch
              image: pragma-encoder:latest
              command:
                - torchrun
                - --nproc_per_node=4
                - scripts/train_pragma.py
                - --config
                - configs/pragma_m.yaml
                - --data-dir
                - /data/transactions
                - --output-dir
                - /outputs/pragma-m
              resources:
                limits:
                  nvidia.com/gpu: "4"
                  memory: "128Gi"
                requests:
                  memory: "64Gi"
              volumeMounts:
                - name: data
                  mountPath: /data
                - name: outputs
                  mountPath: /outputs
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: pragma-data-pvc
            - name: outputs
              persistentVolumeClaim:
                claimName: pragma-outputs-pvc
    Worker:
      replicas: 3
      restartPolicy: OnFailure
      template:
        spec:
          containers:
            - name: pytorch
              image: pragma-encoder:latest
              command:
                - torchrun
                - --nproc_per_node=4
                - scripts/train_pragma.py
                - --config
                - configs/pragma_m.yaml
                - --data-dir
                - /data/transactions
                - --output-dir
                - /outputs/pragma-m
              resources:
                limits:
                  nvidia.com/gpu: "4"
                  memory: "128Gi"
                requests:
                  memory: "64Gi"
              volumeMounts:
                - name: data
                  mountPath: /data
                - name: outputs
                  mountPath: /outputs
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: pragma-data-pvc
            - name: outputs
              persistentVolumeClaim:
                claimName: pragma-outputs-pvc
