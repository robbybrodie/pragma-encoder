# RHOAI 3.4 Workbench — Notebook CR
# Wave 4: applied after the DSPA (wave 3). The workbench image must exist
# (built in wave 2) before the workbench pod can start, but the ArgoCD sync
# won't block on build completion — the Notebook controller will retry until
# the ImageStreamTag is available.
#
# RHOAI 3.4 auth model (gateway-based, not oauth-proxy):
#   - annotations.notebooks.opendatahub.io/inject-auth: 'true'
#     tells the controller to inject the kube-rbac-proxy sidecar.
#     This is the 3.4 replacement for the old inject-oauth annotation.
#   - The controller creates: blah-kube-rbac-proxy-config ConfigMap,
#     blah-kube-rbac-proxy-tls Secret, and injects the kube-rbac-proxy
#     sidecar container + its volumes into the pod template.
#   - Authentication is via the data-science-gateway (HTTPRoute) +
#     kube-rbac-proxy sidecar. No OAuthClient. No oauth-proxy.
#
# Labels opendatahub.io/dashboard=true and opendatahub.io/odh-managed=true
# are required — the dashboard only shows Open button for notebooks with these.
#
# Hardware profile annotations are required for the dashboard to show the
# workbench without "migration required" warning.
#
# liveness/readinessProbe on the workbench container is required — the
# dashboard tracks workbench start completion via the probe becoming ready.
#
# The nodeSelector pins the workbench to a GPU node. Combined with the
# pipeline's nodeSelector (same label), this guarantees the workbench and
# all pipeline steps land on the same node — required because the shared
# PVC (pragma-encoder-workbench-data) is EBS ReadWriteOnce (one node only).
#
# DO NOT add: kube-rbac-proxy sidecar, kube-rbac-proxy-config ConfigMap,
# kube-rbac-proxy-tls Secret, serviceAccountName — the controller injects
# all of these on first creation when inject-auth: 'true' is set.
apiVersion: kubeflow.org/v1
kind: Notebook
metadata:
  name: pragma-encoder-workbench
  namespace: pragma-encoder
  labels:
    app: pragma-encoder-workbench
    # Required: dashboard only shows Open button for notebooks with these labels
    opendatahub.io/dashboard: "true"
    opendatahub.io/odh-managed: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "4"
    # RHOAI 3.4: triggers kube-rbac-proxy sidecar injection (replaces inject-oauth)
    notebooks.opendatahub.io/inject-auth: "true"
    opendatahub.io/image-display-name: "PRAGMA Encoder"
    opendatahub.io/username: kube:admin
    openshift.io/display-name: "PRAGMA Encoder Workbench"
    openshift.io/description: "Workbench for training and evaluating the PRAGMA transaction foundation model"
    notebooks.opendatahub.io/last-image-selection: "pragma-encoder-workbench:latest"
    # Hardware profile: GPU profile in redhat-ods-applications (see notebook-image/hardware-profile-gpu.yaml)
    opendatahub.io/hardware-profile-name: pragma-encoder-gpu
    opendatahub.io/hardware-profile-namespace: redhat-ods-applications
spec:
  template:
    spec:
      enableServiceLinks: false
      initContainers:
        - name: git-clone
          image: image-registry.openshift-image-registry.svc:5000/redhat-ods-applications/pragma-encoder-workbench:latest
          command:
            - /bin/sh
            - -c
            - |
              set -e
              REPO=/opt/app-root/src/pragma-encoder
              if [ -d "${REPO}/.git" ]; then
                echo "Repo already present — skipping clone"
              else
                echo "Cloning repository..."
                git clone \
                  --branch main \
                  --single-branch \
                  https://github.com/robbybrodie/pragma-encoder.git \
                  "${REPO}"
                cd "${REPO}"
                git lfs install
                echo "Pulling LFS objects..."
                git lfs pull || echo "Warning: LFS pull incomplete — run 'git lfs pull' in the workbench if needed"
              fi
              echo "Init complete."
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: workbench-data
              mountPath: /opt/app-root/src
      nodeSelector:
        nvidia.com/gpu.present: "true"
      containers:
        - name: pragma-encoder-workbench
          image: image-registry.openshift-image-registry.svc:5000/redhat-ods-applications/pragma-encoder-workbench:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8888
              name: notebook-port
              protocol: TCP
          env:
            - name: NOTEBOOK_ARGS
              value: |
                --ServerApp.port=8888
                                  --ServerApp.token=''
                                  --ServerApp.password=''
                                  --ServerApp.base_url=/notebook/pragma-encoder/pragma-encoder-workbench
                                  --ServerApp.quit_button=False
            - name: JUPYTER_IMAGE
              value: image-registry.openshift-image-registry.svc:5000/redhat-ods-applications/pragma-encoder-workbench:latest
            - name: KFP_API_HOST
              value: "https://ds-pipeline-pipelines-definition.pragma-encoder.svc.cluster.local:8888"
            - name: KF_PIPELINES_ENDPOINT
              value: "https://ds-pipeline-pipelines-definition.pragma-encoder.svc.cluster.local:8888"
          envFrom:
            - secretRef:
                name: pragma-workbench-env
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /notebook/pragma-encoder/pragma-encoder-workbench/api
              port: notebook-port
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 5
            successThreshold: 1
            timeoutSeconds: 1
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /notebook/pragma-encoder/pragma-encoder-workbench/api
              port: notebook-port
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 5
            successThreshold: 1
            timeoutSeconds: 1
          resources:
            requests:
              cpu: "4"
              memory: 32Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "8"
              memory: 64Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: workbench-data
              mountPath: /opt/app-root/src
            - name: trusted-ca
              mountPath: /etc/pki/tls/custom-certs
              readOnly: true
            - name: runtime-images
              mountPath: /opt/app-root/pipeline-runtimes/
          workingDir: /opt/app-root/src
      volumes:
        - name: workbench-data
          persistentVolumeClaim:
            claimName: pragma-encoder-workbench-data
        - name: trusted-ca
          configMap:
            name: workbench-trusted-ca-bundle
            optional: true
        - name: runtime-images
          configMap:
            name: pipeline-runtime-images
            optional: true
---
# PersistentVolumeClaim for workbench home directory
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pragma-encoder-workbench-data
  namespace: pragma-encoder
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Gi
