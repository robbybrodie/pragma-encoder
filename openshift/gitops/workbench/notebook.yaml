apiVersion: kubeflow.org/v1
kind: Notebook
metadata:
  name: pragma-workbench
  namespace: pragma-encoder
  labels:
    app: pragma-encoder
    app.kubernetes.io/managed-by: argocd
    opendatahub.io/odh-managed: "true"
spec:
  template:
    spec:
      containers:
        - name: pragma-workbench
          image: pragma-encoder:latest
          resources:
            limits:
              memory: "16Gi"
              nvidia.com/gpu: "1"
            requests:
              memory: "8Gi"
          volumeMounts:
            - name: pragma-workbench-storage
              mountPath: /opt/app-root/src
      volumes:
        - name: pragma-workbench-storage
          persistentVolumeClaim:
            claimName: pragma-workbench-pvc
