apiVersion: serving.kserve.io/v1alpha1
kind: ServingRuntime
metadata:
  name: pragma-encoder-runtime
  namespace: pragma-encoder
  labels:
    app: pragma-encoder
    app.kubernetes.io/managed-by: argocd
spec:
  supportedModelFormats:
    - name: pytorch
      version: "2"
      autoSelect: true
  containers:
    - name: kserve-container
      image: pragma-encoder:serving-latest
      args:
        - --model_name=pragma-encoder
        - --model_dir=/mnt/models
        - --http_port=8080
      resources:
        limits:
          memory: "8Gi"
          nvidia.com/gpu: "1"
        requests:
          memory: "4Gi"
